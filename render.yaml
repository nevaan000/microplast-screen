services:
  - type: web
    name: microplast-screen
    runtime: docker
    # Persistent disks require a paid instance; "free" cannot mount /data and
    # would lose the uploaded images and trained model on every deploy.
    plan: starter
    region: oregon
    # Images are written to the local disk of one instance: never scale this
    # out. Postgres records are shared, the files behind them are not. Set
    # BLOB_STORE_ID and BLOB_READ_WRITE_TOKEN instead to run several instances.
    numInstances: 1
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    disk:
      name: microplast-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Must match the disk mountPath above.
      - key: DATA_DIR
        value: /data
      # Records live in Postgres. Use the pooled (-pooler) Neon connection
      # string; Render prompts for it on the first deploy.
      - key: DATABASE_URL
        sync: false
      # Render generates a strong random value once; copy it into the firmware
      # secrets.h as DEVICE_API_KEY so the ESP32-CAM can upload.
      - key: DEVICE_API_KEY
        generateValue: true
      # sync: false makes Render prompt for this on first deploy. Leaving it
      # empty publishes the dashboard with no login at all.
      - key: ADMIN_PASSWORD
        sync: false
